<!doctype html><html lang="mr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uttam Order Memo</title>
<style>
body{font-family:-apple-system,Arial;margin:0;background:#f3f6f3;color:#172117}header{background:#07551f;color:white;text-align:center;padding:18px;font-weight:bold;font-size:20px}main{padding:10px;max-width:900px;margin:auto}.c{background:#fff;border-radius:12px;padding:12px;margin:9px 0;box-shadow:0 2px 8px #0001}input,select,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid #bbb;border-radius:7px;font-size:16px;box-sizing:border-box}table{width:100%;border-collapse:collapse;min-width:650px}th{background:#07551f;color:white;padding:7px}td{border:1px solid #ddd;padding:5px;text-align:center}.scroll{overflow:auto}.btn{border:0;border-radius:8px;padding:11px 14px;color:white;font-weight:bold;margin:3px}.add{background:#07551f}.save{background:#087b34}.pdf{background:#1769aa}.wa{background:#159447}.del{background:#c62828}.tot{display:flex;justify-content:space-between;background:#edf7ed;padding:9px;margin-top:7px;border-radius:7px;font-weight:bold}
</style><header>M/S UTTAM AGENCIES VITA<br><small>ORDER MEMO</small></header><main>
<div class="c"><input id="party" placeholder="Party Name"><input id="date" type="date"><input id="memo" placeholder="Memo No."></div>
<div class="c"><h3>ORDER ITEMS</h3><div class="scroll"><table><thead><tr><th>Item</th><th>Size</th><th>Qty</th><th>Kg/Unit</th><th>Total Kg</th><th>✕</th></tr></thead><tbody id="ib"></tbody></table></div><div class="tot">Total Qty <span id="iq">0</span> | Total Kg <span id="ik">0.000</span></div><button class="btn add" onclick="addItem()">＋ ADD ITEM</button></div>
<div class="c"><h3>SCHEME चा तपशील</h3><div class="scroll"><table><thead><tr><th>Scheme Item</th><th>Qty</th><th>Kg/Unit</th><th>Total Kg</th><th>✕</th></tr></thead><tbody id="sb"></tbody></table></div><div class="tot">Scheme Qty <span id="sq">0</span> | Scheme Kg <span id="sk">0.000</span></div><button class="btn add" onclick="addScheme()">＋ ADD SCHEME ITEM</button></div>
<div class="c"><textarea id="remark" placeholder="Remark / Notes"></textarea><br><button class="btn save" onclick="saveIt()">SAVE</button><button class="btn pdf" onclick="print()">PDF / PRINT</button><button class="btn wa" onclick="whatsapp()">WHATSAPP</button><button class="btn del" onclick="clearIt()">CLEAR</button></div>
</main><script>
const M=[["GS","1kg",1],["GS","500gm",.5],["GS","250gm",.25],["GS","100gm",.1],["GS","20/-",.02],["GS","10/-",.01],["GS","5/-",.005],["Karma","250gm",.25],["Hi Mark","5kg",5],["GS","250mmr",.25],["Elachi","250gm",.25],["Elachi","10/-",.01]];
const S=[["GS 250gm",.25],["GS 250 Gold Dust",.25],["Hi Mark 5kg",5]];
let a=[],b=[];
function addItem(){a.push({n:"GS",s:"1kg",q:0,k:1});draw()}
function addScheme(){b.push({n:"GS 250gm",q:0,k:.25});draw()}
function draw(){
ib.innerHTML=a.map((x,i)=>{let names=[...new Set(M.map(z=>z[0]))],sizes=M.filter(z=>z[0]==x.n).map(z=>z[1]);return `<tr><td><select onchange="a[${i}].n=this.value;let z=M.find(v=>v[0]==this.value);a[${i}].s=z[1];a[${i}].k=z[2];draw()">${names.map(z=>`<option ${z==x.n?"selected":""}>${z}</option>`)}</select></td><td><select onchange="a[${i}].s=this.value;a[${i}].k=M.find(z=>z[0]==a[${i}].n&&z[1]==this.value)[2];draw()">${sizes.map(z=>`<option ${z==x.s?"selected":""}>${z}</option>`)}</select></td><td><input type=number min=0 value="${x.q}" onchange="a[${i}].q=+this.value||0;draw()"></td><td><input type=number step=.001 min=0 value="${x.k}" onchange="a[${i}].k=+this.value||0;draw()"></td><td>${(x.q*x.k).toFixed(3)}</td><td><button class="btn del" onclick="a.splice(${i},1);draw()">✕</button></td></tr>`}).join("");
let q=a.reduce((t,x)=>t+x.q,0),k=a.reduce((t,x)=>t+x.q*x.k,0);iq.textContent=q;ik.textContent=k.toFixed(3);
sb.innerHTML=b.map((x,i)=>`<tr><td><select onchange="b[${i}].n=this.value;b[${i}].k=S.find(z=>z[0]==this.value)[1];draw()">${S.map(z=>`<option ${z[0]==x.n?"selected":""}>${z[0]}</option>`).join("")}</select></td><td><input type=number min=0 value="${x.q}" onchange="b[${i}].q=+this.value||0;draw()"></td><td><input type=number step=.001 min=0 value="${x.k}" onchange="b[${i}].k=+this.value||0;draw()"></td><td>${(x.q*x.k).toFixed(3)}</td><td><button class="btn del" onclick="b.splice(${i},1);draw()">✕</button></td></tr>`).join("");
let q2=b.reduce((t,x)=>t+x.q,0),k2=b.reduce((t,x)=>t+x.q*x.k,0);sq.textContent=q2;sk.textContent=k2.toFixed(3)
}
function saveIt(){localStorage.setItem("uttam_"+(memo.value||Date.now()),JSON.stringify({party:party.value,date:date.value,memo:memo.value,a,b,remark:remark.value}));alert("Order Saved")}
function whatsapp(){location.href="https://wa.me/?text="+encodeURIComponent("M/S UTTAM AGENCIES VITA\nParty: "+party.value+"\nTotal Qty: "+iq.textContent+"\nTotal Kg: "+ik.textContent)}
function clearIt(){if(confirm("Clear?")){a=[];b=[];draw()}}
date.value=new Date().toISOString().slice(0,10);addItem();addScheme();
</script></html>
