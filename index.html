<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M/S UTTAM AGENCIES VITA - Order Memo</title>
<style>
:root{--g:#07551f;--g2:#0b6b2b;--gold:#d7b63f;--bg:#f4f7f4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#182018}
.header{background:linear-gradient(135deg,#013514,#0b6b2b);color:#fff;padding:14px 12px;text-align:center}
.header img{width:100%;max-height:115px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.header h1{font-size:22px;margin:5px 0;color:#ffe16a}.header small{color:#eee}
.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:white;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}label{font-weight:700;font-size:13px}input,select,button{font:inherit}input,select{width:100%;padding:9px;border:1px solid #bbb;border-radius:7px;margin-top:4px}
h2{color:var(--g);font-size:19px;margin:4px 0 10px}table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--g);color:white;padding:8px}td{border:1px solid #ddd;padding:6px;text-align:center}td:first-child{text-align:left}.actions{display:flex;gap:6px;justify-content:center}.btn{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}.add{background:var(--g);color:#fff}.save{background:#0a7d35;color:#fff}.pdf{background:#1769aa;color:#fff}.wa{background:#159447;color:#fff}.clear{background:#c62828;color:#fff}.edit{background:#eef5ff;color:#1456a0}.del{background:#ffecec;color:#c00}.totals{display:flex;justify-content:space-between;background:#edf7ed;padding:10px;font-weight:700;margin-top:8px;border-radius:7px}
.scheme-row input{min-width:90px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:7px}table{font-size:12px}.header h1{font-size:18px}.card{padding:9px;overflow:auto}}
@media print{.no-print{display:none!important}.card{box-shadow:none}.header{color:#000;background:#fff}.header h1{color:#000}}

.brand img{max-width:240px;max-height:110px;object-fit:contain;border-radius:8px;margin-bottom:6px}
@media print{
 @page{size:A4 portrait;margin:10mm}
 body{background:#fff}
 .wrap{max-width:none;padding:0}
 .header{background:#fff!important;color:#000!important;border-bottom:2px solid #07551f}
 .header h1{color:#000!important}
 .brand img{max-width:180px;max-height:70px}
 .card{box-shadow:none;border:1px solid #ddd;padding:8px;margin:6px 0;break-inside:avoid}
 .no-print{display:none!important}
 input,select,textarea{border:0;padding:2px}
}
.edit{background:#eef5ff;color:#1456a0}.actions{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="header">
  <img src="logo.jpg" alt="Uttam Agencies">
  <h1>M/S UTTAM AGENCIES VITA</h1>
  <small>ORDER MEMO</small>
</div>
<div class="wrap">
<div class="card">
 <div class="grid">
  <label>Party Name *<input id="party" placeholder="Enter Party Name"></label>
  <label>Date *<input id="date" type="date"></label>
  <label>Memo No.<input id="memo" placeholder="OM-001"></label>
 </div>
</div>

<div class="card">
<h2>ORDER ITEMS</h2>
<table id="items"><thead><tr><th>Sr.</th><th>Item</th><th>Size</th><th>Qty</th><th>Kg/Unit (Editable)</th><th>Total Kg</th><th class="no-print">Action</th></tr></thead><tbody></tbody></table>
<div class="totals"><span id="itemCount">Total Items: 0</span><span id="qtyTotal">Total Qty: 0</span><span id="kgTotal">Total Kg: 0.000</span></div>
<div class="toolbar no-print"><button class="btn add" onclick="addItem()">＋ ADD ITEM</button></div>
</div>

<div class="card">
<h2>🎁 SCHEME चा तपशील</h2>
<table id="schemes"><thead><tr><th>Sr.</th><th>Scheme Item</th><th>Qty</th><th>Kg/Unit (Editable)</th><th>Total Kg</th><th class="no-print">Action</th></tr></thead><tbody></tbody></table>
<div class="totals"><span id="schemeQtyTotal">Scheme Total Qty: 0</span><span id="schemeKgTotal">Scheme Total Kg: 0.000</span></div>
<div class="toolbar no-print"><button class="btn add" onclick="addScheme()">＋ ADD SCHEME ITEM</button></div>
</div>

<div class="card no-print">
<h2>📂 Saved Orders</h2>
<div id="savedOrders" style="display:grid;gap:7px"></div>
</div>

<div class="card">
<label>Remark / Notes<textarea id="remark" rows="3" style="width:100%;margin-top:5px;border:1px solid #bbb;border-radius:7px;padding:9px"></textarea></label>
<div class="toolbar no-print">
<button class="btn save" onclick="saveOrder()">💾 SAVE ORDER</button>
<button class="btn pdf" onclick="window.print()">🖨 PDF / PRINT</button>
<button class="btn wa" onclick="shareWA()">💬 WHATSAPP SHARE</button>
<button class="btn clear" onclick="clearAll()">↻ CLEAR</button>
</div>
</div>
</div>

<script>
const itemMaster=[
["GS","1kg",1],["GS","500gm",.5],["GS","250gm",.25],["GS","100gm",.1],
["GS","20/-",.02],["GS","10/-",.01],["GS","5/-",.005],["Karma","250gm",.25],
["Hi Mark","5kg",5],["GS","250mmr",.25],["Elachi","250gm",.25],["Elachi","10/-",.01]
];
const schemeMaster=[["GS 250gm",.25],["GS 250 Gold Dust",.25],["Hi Mark 5kg",5]];
let items=[], schemes=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addItem(data){items.push(data||{name:"GS",size:"1kg",qty:0,kg:1});render()}
function addScheme(data){schemes.push(data||{name:"GS 250gm",qty:0,kg:.25});render()}
function render(){
 const tb=document.querySelector("#items tbody");tb.innerHTML="";
 items.forEach((x,i)=>{let total=(+x.qty||0)*(+x.kg||0);tb.innerHTML+=`<tr>
 <td>${i+1}</td><td><select onchange="items[${i}].name=this.value">${itemMaster.map(a=>`<option ${a[0]==x.name&&a[1]==x.size?"selected":""}>${esc(a[0])}</option>`).join("")}</select></td>
 <td><select onchange="items[${i}].size=this.value;items[${i}].kg=defaultKg(this.value)">${itemMaster.filter(a=>a[0]==x.name).map(a=>`<option ${a[1]==x.size?"selected":""}>${a[1]}</option>`).join("")}</select></td>
 <td><input type="number" min="0" step="1" value="${x.qty}" onchange="items[${i}].qty=this.value;render()"></td>
 <td><input type="number" min="0" step="0.001" value="${x.kg}" onchange="items[${i}].kg=this.value;render()"></td>
 <td>${total.toFixed(3)}</td><td class="no-print actions"><button class="btn del" onclick="items.splice(${i},1);render()">🗑</button></td></tr>`});
 let q=items.reduce((s,x)=>s+(+x.qty||0),0),kg=items.reduce((s,x)=>s+(+x.qty||0)*(+x.kg||0),0);
 itemCount.textContent="Total Items: "+items.length;qtyTotal.textContent="Total Qty: "+q;kgTotal.textContent="Total Kg: "+kg.toFixed(3);
 const sb=document.querySelector("#schemes tbody");sb.innerHTML="";
 schemes.forEach((x,i)=>{let total=(+x.qty||0)*(+x.kg||0);sb.innerHTML+=`<tr>
 <td>${i+1}</td><td><select onchange="schemes[${i}].name=this.value;schemes[${i}].kg=schemeKg(this.value);render()">${schemeMaster.map(a=>`<option ${a[0]==x.name?"selected":""}>${esc(a[0])}</option>`).join("")}</select></td>
 <td><input type="number" min="0" step="1" value="${x.qty}" onchange="schemes[${i}].qty=this.value;render()"></td>
 <td><input type="number" min="0" step="0.001" value="${x.kg}" onchange="schemes[${i}].kg=this.value;render()"></td>
 <td>${total.toFixed(3)}</td><td class="no-print"><button class="btn del" onclick="schemes.splice(${i},1);render()">🗑</button></td></tr>`});
 let sq=schemes.reduce((s,x)=>s+(+x.qty||0),0),sk=schemes.reduce((s,x)=>s+(+x.qty||0)*(+x.kg||0),0);
 schemeQtyTotal.textContent="Scheme Total Qty: "+sq;schemeKgTotal.textContent="Scheme Total Kg: "+sk.toFixed(3);
}
function defaultKg(size){let a=itemMaster.find(x=>x[1]==size);return a?a[2]:0}
function schemeKg(name){let a=schemeMaster.find(x=>x[0]==name);return a?a[1]:0}
function saveOrder(){
 const key="uttamOrder_"+(memo.value||Date.now());
 const order={party:party.value,date:date.value,memo:memo.value,remark:remark.value,items:JSON.parse(JSON.stringify(items)),schemes:JSON.parse(JSON.stringify(schemes)),savedAt:new Date().toISOString()};
 localStorage.setItem(key,JSON.stringify(order));
 alert("Order saved successfully.");
 renderSavedOrders();
}
function getSavedOrders(){
 const out=[];
 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i);
  if(key && key.indexOf("uttamOrder_")===0){
   try{out.push({key:key,data:JSON.parse(localStorage.getItem(key))})}catch(e){}
  }
 }
 return out.sort((a,b)=>(b.data.savedAt||"").localeCompare(a.data.savedAt||""));
}
function renderSavedOrders(){
 const box=document.getElementById("savedOrders"); if(!box)return;
 const list=getSavedOrders();
 if(!list.length){box.innerHTML='<div style="color:#777;font-size:13px">अजून कोणताही Order Save केलेला नाही.</div>';return;}
 box.innerHTML=list.map((o,i)=>{
  const d=o.data;
  const dt=d.savedAt?new Date(d.savedAt).toLocaleString("en-IN"):"";
  return `<div style="border:1px solid #ddd;border-radius:8px;padding:9px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
   <div><b>${esc(d.party||"Party नाही")}</b><br><span style="font-size:12px;color:#666">Memo: ${esc(d.memo||"-")} &nbsp; Date: ${esc(d.date||"-")}<br>Saved: ${esc(dt)}</span></div>
   <div class="actions" style="margin:0">
    <button class="btn edit" onclick="loadOrder(${i})">OPEN</button>
    <button class="btn del" onclick="deleteOrder(${i})">DELETE</button>
   </div>
  </div>`;
 }).join("");
}
function loadOrder(index){
 const list=getSavedOrders(), o=list[index]; if(!o)return;
 const d=o.data;
 party.value=d.party||""; date.value=d.date||""; memo.value=d.memo||""; remark.value=d.remark||"";
 items=Array.isArray(d.items)?d.items:[]; schemes=Array.isArray(d.schemes)?d.schemes:[];
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function deleteOrder(index){
 const list=getSavedOrders(), o=list[index]; if(!o)return;
 if(confirm("हा saved order delete करायचा का?")){localStorage.removeItem(o.key);renderSavedOrders();}
}
function shareWA(){
 let text=`M/S UTTAM AGENCIES VITA%0AOrder Memo: ${memo.value}%0AParty: ${party.value}%0ATotal Qty: ${qtyTotal.textContent}%0ATotal Kg: ${kgTotal.textContent}`;
 window.open("https://wa.me/?text="+text,"_blank");
}
function clearAll(){if(confirm("Clear current order?")){items=[];schemes=[];party.value="";memo.value="";remark.value="";render()}}
date.value=new Date().toISOString().slice(0,10);
addItem(); render(); renderSavedOrders();
</script>
</body></html>
